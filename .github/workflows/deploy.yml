name: Deploy React App

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - run: npm install
      - run: npm run build
      
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          # Accept multiple common secret names as fallbacks to avoid missing-input errors
          server: ${{ secrets.FTP_SERVER || secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || secrets.FTP_LOGIN }}
          password: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS || secrets.FTP_PWD }}
          local-dir: ./dist/
          server-dir: /public_html/
          # FTPS security mode accepted by this action: 'loose' or 'strict'
          security: loose
          timeout: 600000