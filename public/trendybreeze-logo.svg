<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect x="5" y="5" width="190" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Trendy Text -->
  <text x="25" y="38" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="url(#gradient)">
    Trendy
  </text>
  
  <!-- Breeze Text -->
  <text x="115" y="38" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#3b82f6">
    Breeze
  </text>
  
  <!-- Wind decoration lines -->
  <path d="M 30,20 Q 35,25 40,20 Q 45,25 50,20 Q 55,25 60,20" 
        stroke="#60a5fa" stroke-width="2" fill="none"/>
  <path d="M 120,20 Q 125,25 130,20 Q 135,25 140,20 Q 145,25 150,20" 
        stroke="#93c5fd" stroke-width="2" fill="none"/>
</svg>